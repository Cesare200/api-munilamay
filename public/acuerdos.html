<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<div class="acuerdos-container">

  <div class="acuerdos-header">
    <h2><i class="fas fa-handshake"></i> Acuerdos de Concejo</h2>
    <p class="acuerdos-subtitle">
      Consulta y descarga los acuerdos oficiales emitidos por el Concejo Municipal de Lamay.
    </p>
    <div class="search-container">
      <i class="fas fa-search"></i>
      <input type="text" id="search-acuerdos" placeholder="Buscar por número, año o descripción..." autocomplete="off">
    </div>
  </div>

  <div class="filters-container-acuerdos">
    <div class="filtro-anios" id="filtros-anios-acuerdos"></div>
    <div class="sort-container">
      <label for="sort-acuerdos">Ordenar:</label>
      <select id="sort-acuerdos">
        <option value="fecha_desc">Fecha (reciente primero)</option>
        <option value="fecha_asc">Fecha (antiguo primero)</option>
        <option value="numero_desc">Número ↓</option>
        <option value="numero_asc">Número ↑</option>
      </select>
    </div>
  </div>

  <div class="acuerdos-grid">
    <div class="loading">
      <div class="loading-spinner"></div>
      <p>Cargando acuerdos...</p>
    </div>
  </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', () => {

  const grid = document.querySelector('.acuerdos-grid');
  const aniosContainer = document.getElementById('filtros-anios-acuerdos');
  const searchInput = document.getElementById('search-acuerdos');
  const sortSelect = document.getElementById('sort-acuerdos');

  let acuerdos = [];
  let filtroActivo = null;

  const DIAS_NUEVO = 15;

  function normalizarUrl(url) {
    if (!url) return '#';
    const limpia = String(url).trim();
    return limpia.replace(/([^:]\/)\/+/g, '$1');
  }

  function parsearNumero(item) {
    if (item.numero !== undefined && item.numero !== null && !isNaN(Number(item.numero))) {
      return Number(item.numero);
    }
    const match = String(item.titulo || '').match(/N[°ºo]?\s*(\d+)/i);
    return match ? parseInt(match[1], 10) : 0;
  }

  function formatearFecha(fechaISO) {
    if (!fechaISO) return '---';
    const parts = String(fechaISO).slice(0, 10).split('-');
    if (parts.length !== 3) return fechaISO;
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  }

  function esNuevo(item) {
    if (item.status && String(item.status).toLowerCase() === 'nuevo') return true;
    if (!item.fecha) return false;
    const [anio, mes, dia] = String(item.fecha).slice(0, 10).split('-').map(Number);
    const fechaPub = new Date(anio, mes - 1, dia);
    const hoy = new Date();
    const difDias = (hoy - fechaPub) / (1000 * 60 * 60 * 24);
    return difDias >= 0 && difDias <= DIAS_NUEVO;
  }

  fetch('http://localhost:8000/api/acuerdos-concejo')
    .then(res => {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    })
    .then(data => {
      const items = Array.isArray(data) ? data : (data.data || []);

      acuerdos = items
        .filter(item => item && (item.pdf_url || item.pdf))
        .map(item => {
          const num = parsearNumero(item);
          const anio = item.anio ? Number(item.anio) : (item.fecha ? parseInt(item.fecha.slice(0, 4), 10) : 2026);
          const urlPdf = normalizarUrl(item.pdf_url || item.pdf);
          const titulo = item.titulo || `ACUERDO DE CONCEJO N° ${String(num).padStart(3, '0')}-${anio}-MDL-C`;

          return {
            ...item,
            numero: num,
            anio: anio,
            titulo: titulo,
            pdf: urlPdf,
            es_nuevo: esNuevo(item)
          };
        });

      generarPestanias();
      aplicarFiltros();
    })
    .catch(err => {
      console.error(err);
      grid.innerHTML = `
        <div class="no-results">
          <i class="fas fa-exclamation-triangle"></i>
          <span>No se pudieron cargar los acuerdos de concejo desde el servidor.</span>
        </div>`;
    });

  function generarPestanias() {
    aniosContainer.innerHTML = '';
    const years = [...new Set(acuerdos.map(r => r.anio))].sort((a, b) => b - a);

    years.forEach((year, index) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'filter-btn';
      btn.textContent = `ACUERDOS ${year}`;

      if (index === 0) {
        btn.classList.add('active');
        filtroActivo = year;
      }

      btn.onclick = () => {
        document.querySelectorAll('#filtros-anios-acuerdos .filter-btn')
          .forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filtroActivo = year;
        aplicarFiltros();
      };

      aniosContainer.appendChild(btn);
    });
  }

  function aplicarFiltros() {
    let resultado = acuerdos.filter(r => r.anio === filtroActivo);

    const busqueda = searchInput.value.toLowerCase().trim();
    if (busqueda !== '') {
      resultado = resultado.filter(r =>
        r.numero.toString().includes(busqueda) ||
        r.anio.toString().includes(busqueda) ||
        (r.titulo && r.titulo.toLowerCase().includes(busqueda))
      );
    }

    switch (sortSelect.value) {
      case 'fecha_desc':
        resultado.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
        break;
      case 'fecha_asc':
        resultado.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
        break;
      case 'numero_desc':
        resultado.sort((a, b) => b.numero - a.numero);
        break;
      case 'numero_asc':
        resultado.sort((a, b) => a.numero - b.numero);
        break;
    }

    renderizar(resultado);
  }

  function renderizar(data) {
    grid.innerHTML = '';

    if (data.length === 0) {
      grid.innerHTML = `
        <div class="no-results">
          <i class="fas fa-folder-open"></i>
          <span>No se encontraron acuerdos de concejo.</span>
        </div>`;
      return;
    }

    const fragment = document.createDocumentFragment();

    data.forEach(item => {
      const card = document.createElement('div');
      card.className = 'acuerdo-card';

      const badgeNuevo = item.es_nuevo
        ? '<span class="resolucion-badge new"><i class="fas fa-bell"></i>Nuevo</span>'
        : '';

      card.innerHTML = `
        <div class="card-header">
          ${badgeNuevo}
          <span class="acuerdo-badge">ACUERDO DE CONCEJO</span>
          <span class="acuerdo-year">${item.anio}</span>
        </div>
        <div class="card-body">
          <h3 class="acuerdo-title">${item.titulo}</h3>
          <div class="acuerdo-meta">
            <span class="meta-date">
              <i class="fas fa-calendar-alt"></i> ${formatearFecha(item.fecha)}
            </span>
            <span class="meta-number">
              <i class="fas fa-hashtag"></i> ${String(item.numero).padStart(3, '0')}
            </span>
          </div>
        </div>
        <div class="card-footer">
          <a href="${item.pdf}" target="_blank" rel="noopener noreferrer" class="download-btn">
            <i class="fas fa-file-pdf"></i> Descargar PDF
          </a>
        </div>
      `;

      fragment.appendChild(card);
    });

    grid.appendChild(fragment);
  }

  searchInput.addEventListener('input', aplicarFiltros);
  sortSelect.addEventListener('change', aplicarFiltros);

});
</script>

<style>

  background: var(--color-primary);

  font-size: 0.875rem;

.download-btn:hover {

@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 768px) {
  .acuerdos-container { padding: 1.25rem; margin: 1rem 0.5rem; }

</style>
