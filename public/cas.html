<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    :root {
      --color-primary:      #063B00;
      --color-primary-light:#266210;
      --color-secondary:    #90B800;
      --color-light:        #F7FAF2;
      --color-dark:         #222222;
      --color-gray:         #555555;
      --color-light-gray:   #EEEEEE;
      --color-success:      #5F8A3B;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      overflow-x: hidden;
      width: 100%;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      background: #f5f5f5;
      color: var(--color-dark);
    }

    /* ── Contenedor ── */
    .cas-container {
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      max-width: 1200px;
      width: 100%;
      margin: 2rem auto;
      padding: 2rem;
      background: white;
      border-radius: 0.5rem;
      box-shadow: var(--shadow-md);
      color: var(--color-dark);
      overflow-x: hidden;
    }

    /* ── Header ── */
    .cas-header {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid var(--color-primary);
    }
    .cas-header h2 {
      color: var(--color-primary);
      font-size: 2rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .cas-subtitle {
      color: var(--color-gray);
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }

    /* ── Buscador ── */
    .search-container {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      width: 100%;
    }
    .search-container i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-gray);
      pointer-events: none;
    }
    #search-cas {
      width: 100%;
      max-width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      border: 1px solid var(--color-light-gray);
      border-radius: 0.5rem;
      font-size: 1rem;
      transition: var(--transition);
      box-sizing: border-box;
      font-family: inherit;
    }
    #search-cas:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(6,59,0,0.10);
    }

    /* ── Filtros ── */
    .filters-container {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--color-light-gray);
    }
    .filtros-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .filtros-fila {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .filter-btn {
      padding: 0.5rem 1.25rem;
      background: white;
      border: 1px solid var(--color-light-gray);
      border-radius: 2rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .filter-btn:hover,
    .filter-btn:focus {
      background: var(--color-light);
      border-color: var(--color-primary-light);
      outline: none;
    }
    .filter-btn.active {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }
    .sort-container {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    #sort-by {
      padding: 0.5rem;
      border-radius: 0.25rem;
      border: 1px solid var(--color-light-gray);
      background: white;
      font-family: inherit;
      font-size: 0.9rem;
    }

    /* ── Grid ── */
    .cas-grid {
      display: grid;
      /* CORRECCIÓN CLAVE: min(100%, 350px) evita overflow en pantallas pequeñas */
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 350px), 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    /* ── Tarjeta ── */
    .cas-card {
      background: white;
      border-radius: 0.5rem;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--color-light-gray);
    }
    .cas-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-md);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--color-light);
      border-bottom: 1px solid var(--color-light-gray);
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .cas-badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-weight: bold;
      background: var(--color-primary);
      color: white;
      word-break: break-word;
    }
    .resolucion-badge.new {
    background: #90B800;
    color: #fff;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 20px;
    margin-left: 10px;
    animation: pulse 1.5s infinite;
    }

    .resolucion-badge.new i {
      margin-right: 0.3rem;
    }
    .cas-year {
      font-weight: bold;
      color: var(--color-primary);
      margin-left: auto;
    }
    .card-body {
      padding: 1.25rem;
      flex-grow: 1;
    }
    .cas-title {
      font-size: 1.1rem;
      margin: 0 0 1rem 0;
      color: var(--color-dark);
      font-weight: 600;
      line-height: 1.4;
    }
    .cas-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.875rem;
      color: var(--color-gray);
      flex-wrap: wrap;
    }
    .meta-date, .meta-number {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    .card-footer {
      display: flex;
      border-top: 1px solid var(--color-light-gray);
    }
    .download-btn, .view-btn {
      flex: 1;
      padding: 0.75rem;
      text-align: center;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.875rem;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: inherit;
      border: none;
      cursor: pointer;
    }
    .download-btn {
      background: var(--color-primary);
      color: white;
    }
    .download-btn:hover, .download-btn:focus { background: #266210; outline: none; }
    .view-btn {
      background: white;
      color: var(--color-primary);
    }
    .view-btn:hover, .view-btn:focus { background: var(--color-light); outline: none; }

    /* ── Sin resultados ── */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--color-gray);
      font-size: 1.1rem;
    }
    .no-results i { font-size: 2rem; display: block; margin-bottom: 0.75rem; }

    /* ── Loading ── */
    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--color-gray);
    }
    .loading-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid var(--color-light-gray);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: white;
      border-radius: 0.5rem;
      width: 100%;
      max-width: 1000px;
      max-height: 90vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 2rem;
      /* Safe area para iPhone con home indicator */
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
      position: relative;
      box-shadow: var(--shadow-md);
    }
    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--color-gray);
      padding: 0.5rem;
      line-height: 1;
      z-index: 1;
    }
    .modal-close:hover { color: var(--color-dark); }
    #modal-title {
      color: var(--color-primary);
      margin-bottom: 1.5rem;
      padding-right: 2.5rem;
      font-size: 1.3rem;
      line-height: 1.4;
    }
    .modal-body { margin-bottom: 2rem; }
    .modal-body p { margin-bottom: 0.5rem; }
    .pdf-preview {
      width: 100%;
      height: 500px;
      border: 1px solid var(--color-light-gray);
      border-radius: 0.5rem;
      overflow: hidden;
      margin-top: 1rem;
    }
    .pdf-preview iframe { width: 100%; height: 100%; border: none; }
    .modal-footer { text-align: right; }
    .modal-footer .download-btn {
      display: inline-flex;
      padding: 0.6rem 1.3rem;
      border-radius: 0.25rem;
      text-decoration: none;
    }

    /* ── Responsive ── */
    @media (max-width: 1024px) {
      .cas-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
    }

    @media (max-width: 768px) {
      .cas-container { padding: 1.25rem; margin: 1rem 0.5rem; }
      .cas-header h2 { font-size: 1.6rem; }
      .cas-subtitle { font-size: 1rem; }
      .filters-container { flex-direction: column; align-items: stretch; gap: 0.75rem; }
      .sort-container { margin-left: 0; justify-content: flex-start; }
      .pdf-preview { height: 350px; }
    }

    @media (max-width: 480px) {
      .cas-container { padding: 1rem; margin: 0; border-radius: 0; box-shadow: none; }
      .cas-grid { grid-template-columns: 1fr; gap: 1rem; }
      .card-footer { flex-direction: column; }
      .cas-header h2 { font-size: 1.35rem; gap: 0.4rem; }
      .modal-content { padding: 1.25rem; border-radius: 0.5rem; }
      .pdf-preview { height: 280px; }
      .filtros-fila { gap: 0.4rem; }
      .filter-btn { padding: 0.4rem 0.85rem; font-size: 0.82rem; }
    }
  </style>
</head>
<body>

<div class="cas-container">

  <!-- Header -->
  <div class="cas-header">
    <h2>
      <i class="fas fa-file-contract" aria-hidden="true"></i>
      Contratación Administrativa de Servicios (CAS)
    </h2>
    <p class="cas-subtitle">
      Procesos de Contratación Administrativa de Servicios de la Municipalidad Distrital de Lamay – CAS
    </p>
    <div class="search-container">
      <i class="fas fa-search" aria-hidden="true"></i>
      <input type="text" id="search-cas" placeholder="Buscar CAS..." aria-label="Buscar CAS" autocomplete="off" />
    </div>
  </div>

  <!-- Filtros -->
  <div class="filters-container">
    <div class="filtros-group">
      <div id="filtros-anios" class="filtros-fila"></div>
      <div id="filtros-cas" class="filtros-fila"></div>
    </div>
    <div class="sort-container">
      <label for="sort-by">Ordenar por:</label>
      <select id="sort-by" aria-label="Ordenar CAS por">
        <option value="date-desc">Fecha (reciente primero)</option>
        <option value="date-asc">Fecha (antiguo primero)</option>
      </select>
    </div>
  </div>

  <!-- Grid -->
  <div class="cas-grid" id="cas-grid">
    <div class="loading">
      <div class="loading-spinner"></div>
      <p>Cargando documentos...</p>
    </div>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="cas-modal" aria-hidden="true">
  <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-close" aria-label="Cerrar modal">
      <i class="fas fa-times" aria-hidden="true"></i>
    </button>
    <h2 id="modal-title">CONTRATACIÓN ADMINISTRATIVA DE SERVICIOS (CAS)</h2>
    <div class="modal-body"></div>
    <div class="modal-footer">
      <a href="#" class="download-btn" id="modal-download-btn" target="_blank" rel="noopener noreferrer">
        <i class="fas fa-download" aria-hidden="true"></i> Descargar documento completo
      </a>
    </div>
  </div>
</div>

<script>
/* ── Formato de archivo por extensión ── */
function fmtArchivo(url) {
  var ext = String(url || '').split('.').pop().split('?')[0].toUpperCase();
  if (ext === 'XLSX' || ext === 'XLS') return { label: 'Descargar Excel', icon: 'fa-file-excel' };
  if (ext === 'DOCX' || ext === 'DOC') return { label: 'Descargar Word',  icon: 'fa-file-word'  };
  return                                     { label: 'Descargar PDF',   icon: 'fa-file-pdf'   };
}

/* ── Año desde ISO (fallback) ── */
function getAnio(iso) {
  return parseInt(String(iso).slice(0, 4), 10);
}

/* ── Fecha legible DD/MM/YYYY ── */
function getFechaDisplay(iso) {
  var parts = String(iso || '').slice(0, 10).split('-');
  if (parts.length !== 3) return iso;
  return parts[2] + '/' + parts[1] + '/' + parts[0];
}

/* ── Extrae número correlativo CAS del texto del proceso ── */
function extraerCasInfo(proceso) {
  var m = String(proceso || '').match(/CAS\s*N?[°ºo]?\.?\s*(\d+)\s*-\s*(\d{4})/i);
  if (!m) return { casNum: null, anio: null, numeroDisplay: '---' };
  return {
    casNum: Number(m[1]),
    anio: Number(m[2]),
    numeroDisplay: m[1].padStart(3, '0')
  };
}

/* ── Normalizar URL (corrige dobles diagonales accidentales en rutas) ── */
function normalizarUrl(url) {
  var valor = String(url || '').trim();
  var match = valor.match(/^\[[^\]]*\]\((https?:\/\/[^)]+)\)$/i);
  var limpia = match ? match[1] : valor;
  return limpia.replace(/([^:]\/)\/+/g, '$1');
}

/* ── Fetch con timeout ── */
function fetchConTimeout(url, ms) {
  ms = ms || 12000;
  return new Promise(function(resolve, reject) {
    var timer = setTimeout(function() {
      reject(new Error('timeout'));
    }, ms);
    fetch(url)
      .then(function(res) {
        clearTimeout(timer);
        resolve(res);
      })
      .catch(function(err) {
        clearTimeout(timer);
        reject(err);
      });
  });
}

/* ── Variables globales de estado ── */
var procesos      = [];
var filtroAnio    = null;
var filtroCas     = 'all';
var busqueda      = '';
var orden         = 'date-desc';

/* ── Init ── */
async function init() {
  var grid = document.getElementById('cas-grid');

  var res, data;
  try {
    res = await fetchConTimeout('http://localhost:8000/api/convocatorias-cas', 12000);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (err) {
    var msg = (err.message === 'timeout')
      ? 'La conexión tardó demasiado. Verifica que tu servidor local (Laravel) esté encendido.'
      : 'No se pudieron cargar los datos de la API. ' + (err.message || '');
    grid.innerHTML =
      '<div class="no-results">' +
        '<i class="fas fa-exclamation-triangle"></i>' +
        '<span>' + msg + '</span>' +
      '</div>';
    return;
  }

  // Compatibilidad: acepta arrays directos [...] o envueltos en { data: [...] }
  var items = Array.isArray(data) ? data : (data.data || data.procesos || []);

  /* ── Enriquecer registros según respuesta de tu API ── */
  procesos = items.map(function(p) {
    var urlFinal = normalizarUrl(p.pdf_url || p.url || p.pdf);
    var fmt = fmtArchivo(urlFinal);
    var info = extraerCasInfo(p.proceso);
    var anioFinal = p.anio ? Number(p.anio) : (info.anio !== null ? info.anio : getAnio(p.fecha));
    
    // Determinar badge ('Nuevo' si viene en status o badge)
    var badgeTexto = '';
    if (String(p.status).toLowerCase() === 'nuevo' || String(p.badge).toLowerCase() === 'nuevo') {
      badgeTexto = 'Nuevo';
    }

    return Object.assign({}, p, {
      url:           urlFinal,
      anio:          anioFinal,
      badge:         badgeTexto,
      casNum:        info.casNum,
      fechaDisplay:  getFechaDisplay(p.fecha),
      numeroDisplay: info.numeroDisplay,
      label:         fmt.label,
      icon:          fmt.icon,
    });
  });

  /* ── Años únicos ordenados desc ── */
  var anios = procesos
    .map(function(p) { return p.anio; })
    .filter(function(v, i, a) { return v && a.indexOf(v) === i; })
    .sort(function(a, b) { return b - a; });

  /* Filtro inicial = año más reciente */
  filtroAnio = anios.length ? anios[0] : null;
  filtroCas  = 'all';

  var filtrosAniosEl = document.getElementById('filtros-anios');
  var filtrosCasEl   = document.getElementById('filtros-cas');

  function mkBtn(texto, activo, onClick) {
    var btn = document.createElement('button');
    btn.className = 'filter-btn' + (activo ? ' active' : '');
    btn.textContent = texto;
    btn.setAttribute('type', 'button');
    btn.addEventListener('click', onClick);
    return btn;
  }

  /* ── Botones de AÑO ── */
  function renderFiltrosAnios() {
    filtrosAniosEl.innerHTML = '';
    anios.forEach(function(a) {
      filtrosAniosEl.appendChild(mkBtn('CAS ' + a, a === filtroAnio, function() {
        filtroAnio = a;
        filtroCas = 'all';
        renderFiltrosAnios();
        renderFiltrosCas();
        renderizar();
      }));
    });
  }

  /* ── Botones de CAS ── */
  function renderFiltrosCas() {
    filtrosCasEl.innerHTML = '';
    var casDelAnio = procesos
      .filter(function(p) { return p.anio === filtroAnio && p.casNum !== null; })
      .map(function(p) { return p.casNum; })
      .filter(function(v, i, a) { return a.indexOf(v) === i; })
      .sort(function(a, b) { return b - a; });

    filtrosCasEl.appendChild(mkBtn('TODOS', filtroCas === 'all', function() {
      filtroCas = 'all';
      renderFiltrosCas();
      renderizar();
    }));

    casDelAnio.forEach(function(c) {
      filtrosCasEl.appendChild(mkBtn('CAS ' + String(c).padStart(3, '0'), c === filtroCas, function() {
        filtroCas = c;
        renderFiltrosCas();
        renderizar();
      }));
    });
  }

  renderFiltrosAnios();
  renderFiltrosCas();

  /* ── Búsqueda ── */
  document.getElementById('search-cas').addEventListener('input', function(e) {
    busqueda = e.target.value.toLowerCase().trim();
    renderizar();
  });

  /* ── Ordenar ── */
  document.getElementById('sort-by').addEventListener('change', function(e) {
    orden = e.target.value;
    renderizar();
  });

  renderizar();
}

/* ── Render ── */
function renderizar() {
  var grid = document.getElementById('cas-grid');
  grid.innerHTML = '';

  var lista = procesos.filter(function(p) {
    var matchAnio = p.anio === filtroAnio;
    var matchCas  = filtroCas === 'all' || p.casNum === filtroCas;
    var matchBusc = !busqueda ||
      (p.titulo && p.titulo.toLowerCase().includes(busqueda)) ||
      (p.proceso && p.proceso.toLowerCase().includes(busqueda)) ||
      (p.tipo && p.tipo.toLowerCase().includes(busqueda));
    return matchAnio && matchCas && matchBusc;
  });

  lista.sort(function(a, b) {
    if (orden === 'date-desc') return new Date(b.fecha) - new Date(a.fecha);
    if (orden === 'date-asc')  return new Date(a.fecha) - new Date(b.fecha);
    return 0;
  });

  if (!lista.length) {
    grid.innerHTML =
      '<div class="no-results">' +
        '<i class="fas fa-folder-open"></i>' +
        '<span>No se encontraron documentos.</span>' +
      '</div>';
    return;
  }

  var frag = document.createDocumentFragment();
  lista.forEach(function(p) { frag.appendChild(crearTarjeta(p)); });
  grid.appendChild(frag);
}

/* ── Tarjeta ── */
function crearTarjeta(p) {
  var card = document.createElement('div');
  card.className = 'cas-card';

  var badgeHTML = p.badge
    ? '<span class="resolucion-badge new"><i class="fas fa-bell"></i>' + escHtml(p.badge) + '</span>'
    : '';

  card.innerHTML =
    '<div class="card-header">' +
      badgeHTML +
      '<span class="cas-badge">' + escHtml(p.proceso) + '</span>' +
      '<span class="cas-year">' + p.anio + '</span>' +
    '</div>' +
    '<div class="card-body">' +
      '<h3 class="cas-title">' + escHtml(p.titulo) + '</h3>' +
      '<div class="cas-meta">' +
        '<span class="meta-date"><i class="fas fa-calendar-alt" aria-hidden="true"></i> ' + p.fechaDisplay + '</span>' +
        '<span class="meta-number"><i class="fas fa-hashtag" aria-hidden="true"></i> ' + p.numeroDisplay + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="card-footer">' +
      '<a href="' + escHtml(p.url) + '" target="_blank" rel="noopener noreferrer" class="download-btn" aria-label="' + escHtml(p.label) + '">' +
        '<i class="fas ' + p.icon + '" aria-hidden="true"></i> ' + p.label +
      '</a>' +
      '<button class="view-btn" type="button" aria-label="Vista rápida de ' + escHtml(p.titulo) + '">' +
        '<i class="fas fa-eye" aria-hidden="true"></i> Vista rápida' +
      '</button>' +
    '</div>';

  card.querySelector('.view-btn').addEventListener('click', function() {
    abrirModal(p);
  });

  return card;
}

/* ── Escape HTML ── */
function escHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ── Modal ── */
var modal      = document.getElementById('cas-modal');
var modalClose = modal.querySelector('.modal-close');
var modalDlBtn = document.getElementById('modal-download-btn');

function abrirModal(p) {
  document.getElementById('modal-title').textContent = p.titulo;

  var isPDF = p.label === 'Descargar PDF';
  modal.querySelector('.modal-body').innerHTML =
    '<p><strong>Proceso:</strong> ' + escHtml(p.proceso) + '</p>' +
    '<p><strong>Fecha:</strong> '   + p.fechaDisplay + '</p>' +
    (isPDF
      ? '<div class="pdf-preview"><iframe src="' + escHtml(p.url) + '" title="Vista previa PDF" loading="lazy"></iframe></div>'
      : '<p style="margin-top:1rem;color:#555">Vista previa no disponible para este tipo de archivo (' +
          p.label.replace('Descargar ', '') + '). Usa el botón inferior para descargarlo.</p>'
    );

  modalDlBtn.href = p.url;
  modal.setAttribute('aria-hidden', 'false');
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  modalClose.focus();
}

function cerrarModal() {
  modal.setAttribute('aria-hidden', 'true');
  modal.classList.remove('open');
  document.body.style.overflow = '';
  var iframe = modal.querySelector('iframe');
  if (iframe) iframe.src = '';
}

modalClose.addEventListener('click', cerrarModal);
modal.addEventListener('click', function(e) {
  if (e.target === modal) cerrarModal();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') cerrarModal();
});

/* ── Iniciar ejecución ── */
init();
</script>
</body>
