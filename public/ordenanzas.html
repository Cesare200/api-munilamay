<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<div class="ordenanzas-container">

  <div class="ordenanzas-header">
    <h2><i class="fas fa-file-contract"></i> Ordenanzas Municipales</h2>
    <p class="ordenanzas-subtitle">
      Consulta y descarga las ordenanzas oficiales emitidas por la Municipalidad Distrital de Lamay.
    </p>

    <div class="search-container">
      <i class="fas fa-search"></i>
      <input type="text" id="search-ordenanzas" placeholder="Buscar por número o año..." autocomplete="off">
    </div>
  </div>

  <div class="filters-container-ordenanzas">
    <div class="filtro-anios" id="filtros-anios-ordenanzas"></div>
    <div class="sort-container">
      <label for="sort-ordenanzas">Ordenar:</label>
      <select id="sort-ordenanzas">
        <option value="fecha_desc">Fecha (reciente primero)</option>
        <option value="fecha_asc">Fecha (antiguo primero)</option>
        <option value="numero_desc">Número ↓</option>
        <option value="numero_asc">Número ↑</option>
      </select>
    </div>
  </div>

  <div class="ordenanzas-grid">
    <div class="loading">
      <div class="loading-spinner"></div>
      <p>Cargando ordenanzas municipales...</p>
    </div>
  </div>

</div>

<style>
:root {
  --color-primary:       #063B00;
  --color-primary-light: #266210;
  --color-secondary:     #90B800;
  --color-light:         #F7FAF2;
  --color-dark:          #222222;
  --color-gray:          #555555;
  --color-light-gray:    #EEEEEE;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
  --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.ordenanzas-container {
  font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
  max-width: 1200px;
  width: 100%;
  margin: 2rem auto;
  padding: 2rem;
  background: #ffffff;
  border-radius: 0.5rem;
  box-shadow: var(--shadow-md);
  color: var(--color-dark);
  box-sizing: border-box;
}

.ordenanzas-header {
  text-align: center;
  margin-bottom: 2rem;
  padding-bottom: 1.5rem;
  border-bottom: 2px solid var(--color-primary);
}

.ordenanzas-header h2 {
  color: var(--color-primary);
  font-size: 2rem;
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.ordenanzas-subtitle {
  color: var(--color-gray);
  font-size: 1.05rem;
  margin-bottom: 1.5rem;
}

.search-container {
  max-width: 600px;
  margin: 0 auto;
  position: relative;
  width: 100%;
}

.search-container i {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-gray);
  pointer-events: none;
}

#search-ordenanzas {
  width: 100%;
  padding: 0.75rem 1rem 0.75rem 2.5rem;
  border: 1px solid var(--color-light-gray);
  border-radius: 0.5rem;
  font-size: 1rem;
  font-family: inherit;
  transition: var(--transition);
  box-sizing: border-box;
}

#search-ordenanzas:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(6, 59, 0, 0.10);
}

.filters-container-ordenanzas {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--color-light-gray);
  align-items: center;
}

.filtro-anios {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.filter-btn {
  padding: 0.5rem 1.25rem;
  border-radius: 2rem;
  border: 1px solid var(--color-light-gray);
  background: #ffffff;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 500;
  transition: var(--transition);
}

.filter-btn:hover {
  background: var(--color-light);
  border-color: var(--color-primary-light);
}

.filter-btn.active {
  background: var(--color-primary);
  color: #ffffff;
  border-color: var(--color-primary);
}

.sort-container {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.sort-container label {
  font-size: 0.9rem;
  color: var(--color-gray);
}

#sort-ordenanzas {
  padding: 0.5rem;
  border-radius: 0.25rem;
  border: 1px solid var(--color-light-gray);
  background: #ffffff;
  font-family: inherit;
  font-size: 0.9rem;
}

.ordenanzas-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
  gap: 1.5rem;
}

.ordenanza-card {
  border: 1px solid var(--color-light-gray);
  border-radius: 0.5rem;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
  display: flex;
  flex-direction: column;
  background: #ffffff;
}

.ordenanza-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-md);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.75rem 1rem;
  background: var(--color-light);
  border-bottom: 1px solid var(--color-light-gray);
  gap: 0.5rem;
}

.ordenanza-badge {
  font-size: 0.75rem;
  padding: 0.25rem 0.5rem;
  border-radius: 0.25rem;
  font-weight: bold;
  background: var(--color-primary);
  color: #ffffff;
}

.ordenanza-year {
  font-weight: bold;
  color: var(--color-primary);
  margin-left: auto;
}

.card-body {
  padding: 1.25rem;
  flex-grow: 1;
}

.ordenanza-title {
  font-size: 1.05rem;
  margin: 0 0 1rem 0;
  color: var(--color-dark);
  font-weight: 600;
  line-height: 1.4;
}

.ordenanza-meta {
  display: flex;
  gap: 1rem;
  font-size: 0.875rem;
  color: var(--color-gray);
  flex-wrap: wrap;
}

.meta-date, .meta-number {
  display: flex;
  align-items: center;
  gap: 0.3rem;
}

.card-footer {
  border-top: 1px solid var(--color-light-gray);
}

.download-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  width: 100%;
  padding: 0.75rem;
  background: var(--color-primary);
  color: #ffffff;
  text-decoration: none;
  font-weight: 500;
  font-size: 0.875rem;
  transition: var(--transition);
  box-sizing: border-box;
}

.download-btn:hover {
  background: var(--color-primary-light);
}

.badge-nuevo {
  background: var(--color-secondary);
  color: #ffffff;
  font-size: 11px;
  font-weight: bold;
  padding: 3px 8px;
  border-radius: 20px;
  animation: pulse 1.5s infinite;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
}

@keyframes pulse {
  0%   { opacity: 1; transform: scale(1); }
  50%  { opacity: 0.8; transform: scale(0.98); }
  100% { opacity: 1; transform: scale(1); }
}

.no-results, .loading {
  grid-column: 1 / -1;
  text-align: center;
  padding: 3rem;
  color: var(--color-gray);
}

.no-results i {
  font-size: 2rem;
  display: block;
  margin-bottom: 0.75rem;
}

.loading-spinner {
  display: inline-block;
  width: 40px;
  height: 40px;
  border: 4px solid var(--color-light-gray);
  border-top-color: var(--color-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 1rem;
}

@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 768px) {
  .ordenanzas-container { padding: 1.25rem; margin: 1rem 0.5rem; }
  .filters-container-ordenanzas { flex-direction: column; align-items: stretch; }
  .sort-container { margin-left: 0; }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {

  const grid = document.querySelector('.ordenanzas-grid');
  const aniosContainer = document.getElementById('filtros-anios-ordenanzas');
  const searchInput = document.getElementById('search-ordenanzas');
  const sortSelect = document.getElementById('sort-ordenanzas');

  let ordenanzas = [];
  let filtroActivo = null;

  const DIAS_NUEVO = 15;

  function normalizarUrl(url) {
    if (!url) return '#';
    const limpia = String(url).trim();
    return limpia.replace(/([^:]\/)\/+/g, '$1');
  }

  function parsearNumero(val) {
    const num = parseInt(String(val !== undefined && val !== null ? val : '0').trim(), 10);
    return isNaN(num) ? 0 : num;
  }

  function formatearFecha(fechaISO) {
    if (!fechaISO) return '---';
    const parts = String(fechaISO).slice(0, 10).split('-');
    if (parts.length !== 3) return fechaISO;
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  }

  function esNuevo(item) {
    if (item.status && String(item.status).toLowerCase() === 'nuevo') return true;
    if (!item.fecha) return false;
    const [anio, mes, dia] = String(item.fecha).slice(0, 10).split('-').map(Number);
    const fechaPub = new Date(anio, mes - 1, dia);
    const hoy = new Date();
    const difDias = (hoy - fechaPub) / (1000 * 60 * 60 * 24);
    return difDias >= 0 && difDias <= DIAS_NUEVO;
  }

  fetch('http://localhost:8000/api/ordenanzas')
    .then(res => {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    })
    .then(data => {
      const items = Array.isArray(data) ? data : (data.data || []);

      ordenanzas = items
        .filter(item => item && (item.pdf_url || item.pdf))
        .map(item => {
          const num = parsearNumero(item.numero);
          const anio = item.anio ? Number(item.anio) : (item.fecha ? parseInt(item.fecha.slice(0, 4), 10) : 2026);
          const urlPdf = normalizarUrl(item.pdf_url || item.pdf);

          let titulo = item.titulo;
          if (!titulo) {
            titulo = (num === 0)
              ? `REGLAMENTO PARA LA ATENCIÓN DE DENUNCIAS AMBIENTALES - ${anio}`
              : `ORDENANZA MUNICIPAL Nº ${String(num).padStart(3, '0')}-${anio}-MDL/C`;
          }

          return {
            ...item,
            numero: num,
            anio: anio,
            titulo: titulo,
            pdf: urlPdf,
            es_nuevo: esNuevo(item)
          };
        });

      generarPestanias();
      aplicarFiltros();
    })
    .catch(err => {
      console.error(err);
      grid.innerHTML = `
        <div class="no-results">
          <i class="fas fa-exclamation-triangle"></i>
          <span>No se pudieron cargar las ordenanzas municipales desde el servidor.</span>
        </div>`;
    });

  function generarPestanias() {
    aniosContainer.innerHTML = '';
    const years = [...new Set(ordenanzas.map(r => r.anio))].sort((a, b) => b - a);

    years.forEach((year, index) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'filter-btn';
      btn.textContent = `ORDENANZAS ${year}`;

      if (index === 0) {
        btn.classList.add('active');
        filtroActivo = year;
      }

      btn.onclick = () => {
        document.querySelectorAll('#filtros-anios-ordenanzas .filter-btn')
          .forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filtroActivo = year;
        aplicarFiltros();
      };

      aniosContainer.appendChild(btn);
    });
  }

  function aplicarFiltros() {
    let resultado = ordenanzas.filter(r => r.anio === filtroActivo);

    const busqueda = searchInput.value.toLowerCase().trim();
    if (busqueda !== '') {
      resultado = resultado.filter(r =>
        r.numero.toString().includes(busqueda) ||
        r.anio.toString().includes(busqueda) ||
        (r.titulo && r.titulo.toLowerCase().includes(busqueda))
      );
    }

    switch (sortSelect.value) {
      case 'fecha_desc':
        resultado.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
        break;
      case 'fecha_asc':
        resultado.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
        break;
      case 'numero_desc':
        resultado.sort((a, b) => b.numero - a.numero);
        break;
      case 'numero_asc':
        resultado.sort((a, b) => a.numero - b.numero);
        break;
    }

    renderizar(resultado);
  }

  function renderizar(data) {
    grid.innerHTML = '';

    if (data.length === 0) {
      grid.innerHTML = `
        <div class="no-results">
          <i class="fas fa-folder-open"></i>
          <span>No se encontraron ordenanzas municipales.</span>
        </div>`;
      return;
    }

    const fragment = document.createDocumentFragment();

    data.forEach(item => {
      const card = document.createElement('div');
      card.className = 'ordenanza-card';

      const badgeNuevo = item.es_nuevo
        ? '<span class="badge-nuevo"><i class="fas fa-bell"></i>Nuevo</span>'
        : '';

      const etiquetaBadge = item.numero === 0 ? 'REGLAMENTO' : 'ORDENANZA MUNICIPAL';
      const numeroTxt = item.numero === 0 ? 'S/N' : String(item.numero).padStart(3, '0');

      card.innerHTML = `
        <div class="card-header">
          ${badgeNuevo}
          <span class="ordenanza-badge">${etiquetaBadge}</span>
          <span class="ordenanza-year">${item.anio}</span>
        </div>

        <div class="card-body">
          <h3 class="ordenanza-title">${item.titulo}</h3>
          <div class="ordenanza-meta">
            <span class="meta-date">
              <i class="fas fa-calendar-alt"></i> ${formatearFecha(item.fecha)}
            </span>
            <span class="meta-number">
              <i class="fas fa-hashtag"></i> ${numeroTxt}
            </span>
          </div>
        </div>

        <div class="card-footer">
          <a href="${item.pdf}" target="_blank" rel="noopener noreferrer" class="download-btn">
            <i class="fas fa-file-pdf"></i> Descargar PDF
          </a>
        </div>
      `;

      fragment.appendChild(card);
    });

    grid.appendChild(fragment);
  }

  searchInput.addEventListener('input', aplicarFiltros);
  sortSelect.addEventListener('change', aplicarFiltros);

});
</script>
